# Example: running immich-photo-pipeline alongside an existing Immich
# stack, using the published Docker Hub image. Adjust `networks:` to match
# how your Immich compose project names its network.

services:
  immich-photo-pipeline:
    image: bdelima/immich-photo-pipeline:latest
    container_name: immich-photo-pipeline
    environment:
      IMMICH_URL: ${IMMICH_URL}
      # This account's own API key (Immich: Account Settings -> API
      # Keys). Owns/bootstraps the four core albums below on first run
      # and does everything except removing entry-queue originals added
      # by a different account -- see IMMICH_EXTRA_API_KEYS_FILE below.
      IMMICH_API_KEY: ${IMMICH_API_KEY}
      # The four core albums are created automatically on first run if
      # they don't already exist yet, matched/created by name -- no need
      # to look up album ids by hand. Override with the matching
      # *_ALBUM_ID var instead if you already have these set up and want
      # to pin them explicitly (an explicit id always wins over the name
      # lookup).
      # COLLAGE_ALBUM_NAME: "Collage Maker"
      # WALLPAPER_ALBUM_NAME: "Wallpaper Maker"
      # REVIEW_ALBUM_NAME: "Review"
      # LIVE_ALBUM_NAME: "Live"
      # COLLAGE_ALBUM_ID: ${COLLAGE_ALBUM_ID}
      # WALLPAPER_ALBUM_ID: ${WALLPAPER_ALBUM_ID}
      # REVIEW_ALBUM_ID: ${REVIEW_ALBUM_ID}
      # LIVE_ALBUM_ID: ${LIVE_ALBUM_ID}
      #
      # These albums are shared albums once bootstrapped -- Immich still
      # needs each household member's account invited to them by hand
      # (Immich UI: the album's Share menu) before they can drop photos
      # into the entry queues or like/comment on Review and the managed
      # albums. The pipeline doesn't automate that invite step.
      POLL_INTERVAL_SECONDS: "15"
      # Claude Pro auth: the token file bind-mounted below is the
      # preferred path (see the volumes block) -- rotating the token is
      # then just "overwrite that file", never "edit this compose file
      # and restart". CLAUDE_CODE_OAUTH_TOKEN here is only a fallback for
      # when a bind-mounted secrets file isn't convenient; the file wins
      # if both are present.
      # CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      #
      # Never set ANTHROPIC_API_KEY in this service: Claude Code prefers
      # it over the subscription token above and silently switches to
      # metered API billing instead of your Pro allocation.
      #
      # To generate a token: `docker exec -it immich-photo-pipeline claude
      # setup-token` (or run it on any other machine with a browser). It
      # opens a normal claude.ai login -- Google/passkey/etc. all work --
      # and prints the token to the terminal; nothing is saved
      # automatically, so copy it into the file below yourself.
      #
      # Uncomment to iterate on the recipe skill without rebuilding the
      # image: RECIPE_SKILL_PATH just gets passed straight through to
      # `claude --skill <path>`, read fresh on every invocation, so an
      # edit to the bind-mounted file below takes effect on the very next
      # poll cycle -- no restart needed. Leave both commented out to use
      # the copy baked into the image at /app/photo-mat-recipe instead.
      # RECIPE_SKILL_PATH: /skills/photo-mat-recipe
    volumes:
      - ./pipeline-data:/data
      # Claude Pro OAuth token, generated once with `claude setup-token`
      # (see the environment block above for how) and saved to this
      # file. Must be readable by uid 1000, since the container drops
      # to that non-root user. The container checks this periodically
      # and recovers on its own when the file appears or changes -- no
      # restart needed. See /healthz and the container logs for setup
      # instructions if this is missing or stale.
      - ./secrets/claude_oauth_token:/run/secrets/claude_oauth_token:ro
      # Other household members' own Immich API keys (each generated
      # from THEIR account's Account Settings -> API Keys), one per
      # line, '#' comments allowed. Immich restricts removing an asset
      # from an album to whoever added it -- not even the album owner or
      # an admin key can override that -- so when someone else's account
      # dropped a photo into an entry-queue album, the primary key alone
      # can never clear it out again. The pipeline tries the primary key
      # first, then each of these in turn, and only if every one of them
      # fails does it leave a comment asking you to delete it by hand.
      # Unlike the Claude token above, this file is only read once at
      # startup -- restart the container after adding a new line.
      # - ./secrets/immich_extra_api_keys:/run/secrets/immich_extra_api_keys:ro
      # Pairs with RECIPE_SKILL_PATH above. The container runs as uid
      # 1000, so this host directory needs to be readable by that uid
      # (or just world-readable).
      # - ./photo-mat-recipe:/skills/photo-mat-recipe
    ports:
      - "8096:8080"
    restart: unless-stopped
    networks:
      - default

networks:
  default:
    name: immich_default
    external: true

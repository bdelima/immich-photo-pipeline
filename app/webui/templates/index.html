<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>immich-photo-pipeline</title>
  {% include "_icons.html" %}
  <link rel="stylesheet" href="{{ url_for('static', filename='pipeline.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='photos.css') }}">
</head>
<body>
  <nav>
    <div class="brand"><img src="{{ url_for('static', filename='icon-small.svg') }}" alt="" width="28" height="28"><h1>Immich Photo Pipeline</h1></div>
    <div id="tree"></div>
  </nav>
  <main id="pipeView">
    <div class="card head">
      <h2 id="title"></h2>
      <span class="chip" id="total"></span>
      <span class="sp"></span>
      <span id="status" class="status" role="status"></span>
      <button class="btn sec sm" id="retBtn" aria-haspopup="dialog" aria-expanded="false" hidden></button>
    </div>
    <div id="bar" class="card" hidden>
      <strong id="count"></strong>
      <button class="btn sec" onclick="selectAll()">Select all</button>
      <button class="btn sec" onclick="clearSel()">Clear</button>
      <span class="sp"></span>
      <span id="normal">
        <button class="btn sec" id="addLive" onclick="promote(true)">Add to Live</button>
        <button class="btn sec" id="rmLive" onclick="promote(false)">Remove from Live</button>
        <button class="btn" id="moveBtn" onclick="moveMenu(this)">Move to &#9662;</button>
        <button class="btn warn" onclick="trashSel()">Trash</button>
      </span>
      <span id="intrash" hidden><button class="btn" onclick="restoreSel()">Restore</button> <button class="btn warn" id="delSel" onclick="deleteSel()">Delete</button></span>
    </div>
    <div id="grid" class="grid" style="margin-top:1rem"></div>
    <div id="empty" class="empty" hidden></div>
  </main>
  <main id="photosView" class="ph-pane" hidden></main>
  <main id="rulesView" hidden></main>
  <div id="viewer">
    <div class="dialog">
      <section class="photo">
        <header id="vhead"></header>
        <div class="stage" id="stage"></div>
        <footer id="vfoot"></footer>
      </section>
      <aside id="panel"></aside>
    </div>
  </div>
  <div id="overlay" hidden></div>
  <div id="confirm" class="modalback" hidden></div>
  <div id="retPop" class="pop" role="dialog" aria-label="Auto-delete from Trash" hidden></div>
<script>window.FEATURES = {{ features|tojson }};</script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
<script src="{{ url_for('static', filename='photos.js') }}"></script>
<script src="{{ url_for('static', filename='rules.js') }}"></script>
<script>
let view = "review", list = [], open = -1, albums = [], treeAlbums = [], loadToken = 0, trashDays = 30;
const selected = new Set();
// What the last action in each place said. Each view has its own, so the
// message belongs to the place it happened and not to whatever is open now.
const statusByView = {};

// ---- status ----
function renderStatus() {
  const s = statusByView[view];
  const el = $("status");
  el.textContent = s ? s.text : "";
  el.className = "status" + (s && s.bad ? " bad" : "");
}
function say(text, bad) {
  if (text) statusByView[view] = { text, bad: !!bad }; else delete statusByView[view];
  renderStatus();
}

// ---- menus (the "Move to" choices) ----
let menuEl = null;
function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
function openMenu(anchor, items, pick) {
  closeMenu();
  const m = document.createElement("div");
  m.className = "menu"; menuEl = m;
  const draw = () => {
    m.innerHTML = items.map((it, i) => it.sep ? `<div class="sep"></div>` : `<button data-i="${i}">${esc(it.label)}</button>`).join("");
    for (const b of m.querySelectorAll("button")) b.onclick = () => {
      const it = items[+b.dataset.i];
      if (it.value !== null) { closeMenu(); pick(it.value); } else askName();
    };
  };
  const askName = () => {
    m.innerHTML = `<div class="newname"><input class="field" maxlength="60" placeholder="Album name"><button class="btn sm">Create</button></div>`;
    const inp = m.querySelector("input");
    const go = () => { const v = inp.value.trim(); if (v) { closeMenu(); pick(v); } };
    m.querySelector("button").onclick = go;
    inp.onkeydown = e => { e.stopPropagation(); if (e.key === "Enter") { e.preventDefault(); go(); } else if (e.key === "Escape") closeMenu(); };
    inp.focus();
  };
  draw();
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + "px";
  m.style.top = (r.bottom + 8 + h > innerHeight && r.top - 8 - h > 0 ? r.top - 8 - h : r.bottom + 8) + "px";
  const first = m.querySelector("button"); if (first) first.focus();
}
document.addEventListener("mousedown", e => { if (menuEl && !menuEl.contains(e.target)) closeMenu(); }, true);

// Only offer places that make sense: never the album a photo is already in.
function moveItems(photos) {
  const homes = new Set(photos.map(p => p.home));
  const here = homes.size === 1 ? [...homes][0] : null;
  const items = [];
  if (here !== "review") items.push({ label: "Review", value: "review" });
  for (const a of albums) if (a !== here) items.push({ label: a, value: a });
  items.push({ sep: true }, { label: "New album…", value: null });
  return items;
}
function moveMenu(anchor) {
  const photos = selPhotos();
  openMenu(anchor, moveItems(photos), home => act("/api/photos/move", { ids: photos.map(p => p.id), home }, "Moved to " + home));
}

// ---- the places ----
// Photos and Recipe rules are views in this window, like Review and the albums: the sidebar and
// header stay, only the area on the right changes (photos.js and rules.js draw them).
const isPane = v => v === "photos" || v === "collage" || v === "rules";
const paneOn = v => v === "collage" ? window.FEATURES.photos : window.FEATURES[v];
function showPane(v) {
  if (v !== "photos" && v !== "collage") PhotosPane.hide();               // remembers where the timeline was, before it is hidden
  $("pipeView").hidden = isPane(v);
  $("photosView").hidden = v !== "photos" && v !== "collage";
  $("rulesView").hidden = v !== "rules";
}
async function openPane(v) {
  const token = ++loadToken;                           // anything still loading for the last place is dropped
  view = v;
  closeViewer(); closeMenu();
  document.title = viewTitle(v) + " · immich-photo-pipeline";
  showPane(v);
  renderTree(v, "").then(t => { treeAlbums = t.albums; albums = t.albums.map(a => a.name); }).catch(() => {});
  if (v === "photos" || v === "collage") PhotosPane.show(v); else RulesPane.show();
}

// Collage Maker changed (a collage was made, photos were removed): the sidebar count follows.
document.addEventListener("collage-changed", () => { renderTree(view, "").catch(() => {}); });

// ---- the grid ----
async function select(v, keep, keepViewer) {
  if (isPane(v) && paneOn(v)) return openPane(v);
  if (isPane(v)) { history.replaceState(null, "", viewHash("review")); v = "review"; }   // not available here
  showPane(v);
  const token = ++loadToken;
  view = v;
  if (!keepViewer) closeViewer();
  closeMenu();
  if (!keep) selected.clear();
  $("title").textContent = viewTitle(v, treeAlbums);
  renderStatus();
  document.title = viewTitle(v, treeAlbums) + " · immich-photo-pipeline";
  let t, photos;
  try {
    [t, photos] = await Promise.all([renderTree(v, ""), api("/api/photos?view=" + encodeURIComponent(v))]);
  } catch (e) {
    if (token !== loadToken) return;
    if (v !== "review") { history.replaceState(null, "", viewHash("review")); return select("review"); }
    say("Couldn't load the photos.", true); return;
  }
  if (token !== loadToken) return;
  treeAlbums = t.albums;
  albums = t.albums.map(a => a.name);
  $("title").textContent = viewTitle(v, treeAlbums);
  document.title = viewTitle(v, treeAlbums) + " · immich-photo-pipeline";
  const canon = canonicalView(v, treeAlbums);
  if (canon !== v) { view = canon; history.replaceState(null, "", viewHash(canon)); renderStatus(); renderTree(canon, "").catch(() => {}); }
  list = photos.photos;
  trashDays = photos.trash_days ?? trashDays;
  paintRetention();
  for (const id of [...selected]) if (!list.some(p => p.id === id)) selected.delete(id);
  $("total").textContent = list.length + (list.length === 1 ? " photo" : " photos");
  $("grid").innerHTML = list.map((p, i) => tile(p, i)).join("");
  $("empty").hidden = list.length > 0;
  $("empty").textContent = "Nothing here.";
  for (const el of $("grid").querySelectorAll(".tile")) wireTile(el);
  updateBar();
}
// A tile finds its photo by position when clicked, so moving tiles around only
// means renumbering them.
function wireTile(el) {
  el.onclick = () => openViewer(+el.dataset.i);
  el.querySelector(".pick").onclick = e => { e.stopPropagation(); toggle(list[+el.dataset.i].id, el); };
}
function toggle(id, el) {
  if (selected.has(id)) selected.delete(id); else selected.add(id);
  el.classList.toggle("sel", selected.has(id));
  updateBar();
}
function selectAll() { for (const p of list) selected.add(p.id); for (const t of $("grid").children) t.classList.add("sel"), t.querySelector(".pick").checked = true; updateBar(); }
function clearSel() { selected.clear(); for (const t of $("grid").children) t.classList.remove("sel"), t.querySelector(".pick").checked = false; updateBar(); }
const selPhotos = () => list.filter(p => selected.has(p.id));
// The buttons offered depend on what is selected: nothing to add to Live if
// every chosen photo is already there, nothing to remove if none is.
function updateBar() {
  const sel = selPhotos();
  $("bar").hidden = sel.length === 0;
  $("count").textContent = sel.length + " selected";
  const trash = view === "trash";
  $("normal").hidden = trash; $("intrash").hidden = !trash;
  $("addLive").hidden = !sel.some(p => !p.live);
  $("rmLive").hidden = !sel.some(p => p.live);
}

// ---- actions ----
// `viewerId` is set when the action was started from the photo view, so the
// view stays open on that photo if it is still in this list.
async function act(path, payload, what, viewerId) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
  const out = await r.json();
  if (!r.ok) { say(out.error || "That didn't work.", true); return null; }
  const skipped = out.skipped.map(s => s.reason + " (" + s.id.slice(0, 8) + ")");
  say(`${what}: ${out.done.length} done` + (skipped.length ? `, ${skipped.length} skipped: ${[...new Set(out.skipped.map(s => s.reason))].join("; ")}` : ""), out.done.length === 0 && skipped.length > 0);
  for (const id of out.done) selected.delete(id);
  await select(view, true, !!viewerId);
  if (viewerId) {
    const i = list.findIndex(p => p.id === viewerId);
    if (i >= 0) openViewer(i); else closeViewer();
  }
  return out;
}
// Moving a photo from its own view takes you with it: the place it was moved
// to opens with the photo still in front of you, instead of the view closing.
async function moveAndFollow(id, home) {
  const r = await fetch("/api/photos/move", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ids: [id], home }) });
  const out = await r.json();
  if (!r.ok) { say(out.error || "That didn't work.", true); return; }
  if (!out.done.includes(id)) { say("Not moved: " + out.skipped.map(s => s.reason).join("; "), true); return; }
  const t = await api("/api/tree");
  // The server collapses runs of spaces in a name, so compare the same way.
  const want = home.split(/\s+/).filter(Boolean).join(" ").toLowerCase();
  const album = t.albums.find(a => a.name.toLowerCase() === want);
  const dest = want === "review" ? "review" : album ? album.view : view;
  if (dest !== view) history.replaceState(null, "", viewHash(dest));
  await select(dest, false, true);
  say("Moved to " + home);
  const i = list.findIndex(x => x.id === id);
  if (i >= 0) openViewer(i); else closeViewer();
}
const ids = () => [...selected];
const promote = live => act("/api/photos/promote", { ids: ids(), live }, live ? "Added to Live" : "Removed from Live");
const trashSel = () => act("/api/photos/trash", { ids: ids() }, "Trashed");
const restoreSel = () => act("/api/photos/restore", { ids: ids() }, "Restored");

// ---- deleting from the trash for good, and the auto-delete limit ----
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
// Whole days left before a trashed photo is auto-deleted, or null when that is off or unknown.
function daysLeft(p) {
  if (!trashDays || !p.trashed_at) return null;
  const age = (Date.now() - new Date(p.trashed_at).getTime()) / 864e5;
  return Math.ceil(trashDays - age);
}
const leftText = n => n <= 0 ? "due" : n + "d left";
function closeConfirm() { dropLayer("confirm"); const c = $("confirm"); c.hidden = true; c.innerHTML = ""; }
// Asks before anything is deleted. Cancel has the focus, so Enter alone never deletes.
function confirmDelete(photos, go) {
  const n = photos.length, c = $("confirm");
  const thumbs = photos.slice(0, 8).map(p => p.has_image && p.media_type === "image" ? `<img src="/media/${esc(p.id)}/thumb?v=${p.version}" alt="">` : `<span></span>`).join("");
  c.innerHTML = `<div class="modal" role="alertdialog" aria-labelledby="cdT">
    <h3 id="cdT">Delete ${n === 1 ? "this photo" : plural(n, "photo")} permanently?</h3>
    <div class="strip2">${thumbs}${n > 8 ? `<small>+${n - 8} more</small>` : ""}</div>
    <p>This can't be undone. ${n === 1 ? "It removes" : "For each photo it removes"}:</p>
    <ul><li>the finished photo and every earlier step</li><li>the pipeline's copy of the original</li><li>its history and chat</li><li>its copy in Immich, deleted for good (including from Immich's trash)</li></ul>
    <div class="keep">Not touched: the contributor's original in their own Immich library.</div>
    <div class="acts"><button class="btn sec" id="cdNo">Cancel</button><button class="btn danger" id="cdYes">Delete</button></div></div>`;
  c.hidden = false; pushLayer("confirm", closeConfirm);          // the browser's Back closes it, like Cancel
  $("cdNo").onclick = () => backLayer("confirm", closeConfirm);
  $("cdYes").onclick = () => { backLayer("confirm", closeConfirm); go(); };
  c.onclick = e => { if (e.target === c) backLayer("confirm", closeConfirm); };
  $("cdNo").focus();
}
const deleteSel = () => { const photos = selPhotos(); if (photos.length) confirmDelete(photos, () => act("/api/photos/delete", { ids: photos.map(p => p.id) }, "Deleted")); };
async function deleteOpen(p) {
  const at = open;
  const out = await act("/api/photos/delete", { ids: [p.id] }, "Deleted");
  if (out && out.done.length && list.length) openViewer(Math.min(at, list.length - 1));
}

const retLabel = () => "Auto-delete: " + (trashDays ? "after " + plural(trashDays, "day") : "off") + " ▾";
function paintRetention() {
  const b = $("retBtn");
  b.hidden = view !== "trash";
  b.textContent = retLabel();
  if (view !== "trash") closeRetention();
}
function closeRetention() { dropLayer("retention"); const p = $("retPop"); if (!p.hidden) { p.hidden = true; p.innerHTML = ""; $("retBtn").setAttribute("aria-expanded", "false"); } }
function openRetention() {
  const pop = $("retPop"), btn = $("retBtn");
  pop.innerHTML = `<h4>Auto-delete from Trash</h4>
    <label class="opt"><input type="radio" name="rm" value="never"${trashDays ? "" : " checked"}> Never &mdash; keep until I delete them</label>
    <label class="opt"><input type="radio" name="rm" value="days"${trashDays ? " checked" : ""}> After <input class="field" type="number" id="rd" min="1" max="365" value="${trashDays || 30}" aria-label="Days in Trash"> days in Trash</label>
    <div class="presets" id="rPresets">${[7, 14, 30, 60, 90].map(d => `<button type="button" data-d="${d}">${d}</button>`).join("")}</div>
    <div class="warnbox" id="rWarn" hidden></div>
    <p class="fine">Counted from the day each photo was trashed, and checked every poll cycle. Deleting also permanently purges its copy in Immich.</p>
    <div class="acts"><button class="btn sec sm" id="rNo">Cancel</button><button class="btn sm" id="rYes">Save</button></div>`;
  const r = btn.getBoundingClientRect();
  pop.style.top = (r.bottom + 8) + "px";
  pop.style.right = Math.max(8, document.documentElement.clientWidth - r.right) + "px";
  pop.hidden = false; pushLayer("retention", closeRetention);       // the browser's Back closes it, like Cancel
  btn.setAttribute("aria-expanded", "true");
  const never = () => pop.querySelector("input[name=rm]:checked").value === "never";
  const draft = () => never() ? 0 : Math.max(1, Math.min(365, Math.floor(+$("rd").value) || 1));
  const refresh = () => {
    const d = draft();
    // Photos the new limit would delete now: the ones already in the list that have been there that long.
    const due = d ? list.filter(p => p.trashed_at && (Date.now() - new Date(p.trashed_at).getTime()) / 864e5 >= d).length : 0;
    $("rWarn").hidden = !due;
    $("rWarn").textContent = due ? `Saving will delete ${plural(due, "photo")} right away: ${due === 1 ? "it has" : "they have"} been in Trash ${plural(d, "day")} or more.` : "";
    $("rYes").textContent = due ? "Save and delete " + due : "Save";
    $("rd").disabled = never();
    for (const b of pop.querySelectorAll("#rPresets button")) b.classList.toggle("on", !never() && +b.dataset.d === d);
  };
  for (const el of pop.querySelectorAll("input[name=rm]")) el.onchange = refresh;
  $("rd").oninput = refresh;
  for (const b of pop.querySelectorAll("#rPresets button")) b.onclick = () => { pop.querySelector("input[value=days]").checked = true; $("rd").value = b.dataset.d; refresh(); };
  $("rNo").onclick = () => backLayer("retention", closeRetention);
  $("rYes").onclick = async () => {
    const days = draft();
    const res = await fetch("/api/trash-settings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ trash_days: days }) });
    const out = await res.json();
    if (!res.ok) { say(out.error || "That didn't work.", true); return; }
    backLayer("retention", closeRetention);
    trashDays = out.trash_days;
    await select(view, true, true);
    say(out.deleted ? `Auto-deleted ${plural(out.deleted, "photo")} older than ${plural(trashDays, "day")}` : "Auto-delete: " + (trashDays ? "after " + plural(trashDays, "day") : "off"));
  };
  refresh();
  $("rd").focus();
}
$("retBtn").onclick = () => $("retPop").hidden ? openRetention() : backLayer("retention", closeRetention);
document.addEventListener("click", e => { if (!$("retPop").hidden && !e.target.closest("#retPop, #retBtn")) backLayer("retention", closeRetention); });

async function revertTo(id, step) {
  const r = await fetch("/api/photos/" + id + "/revert", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ step }) });
  const out = await r.json();
  if (!r.ok) { say(out.error || "That didn't work.", true); return; }
  say(out.unchanged ? "Already showing that step." : "Reverted to step " + step + " (now step " + out.step + ").");
  await select(view, true, true);
  const i = list.findIndex(p => p.id === id);
  if (i >= 0) openViewer(i);
}
// What a thumbnail shows; when it is unchanged the tile is left alone.
const tileSig = p => [p.version, p.status, p.live, p.has_image, p.media_type, p.trashed_at, trashDays].join("|");
function trashBadge(p) {
  const n = p.trashed ? daysLeft(p) : null;
  return n === null ? "" : `<span class="badge age${n <= 0 ? " due" : ""}">${leftText(n)}</span>`;
}
function tile(p, i) {
  const label = p.status !== "ready" ? p.status.replace("_", " ") : p.media_type === "video" ? "video" : "";
  const inner = p.media_type === "image" && p.has_image
    ? `<img loading="lazy" src="/media/${p.id}/thumb?v=${p.version}" alt="">`
    : `<div class="ph">${esc(p.media_type === "video" ? "Video" : p.status.replace("_", " "))}</div>`;
  const on = selected.has(p.id);
  return `<div class="tile${on ? " sel" : ""}" data-i="${i}" data-id="${esc(p.id)}" data-sig="${esc(tileSig(p))}">${inner}<input class="pick" type="checkbox"${on ? " checked" : ""} aria-label="Select">${label ? `<span class="badge">${esc(label)}</span>` : ""}` +
         `${p.live ? `<span class="badge live">Live</span>` : ""}${trashBadge(p)}</div>`;
}

// ---- chat ----
function chatHtml(p) {
  const labels = { queued: "waiting", working: "working on it…", failed: "failed" };
  return p.chat.map(m =>
    `<div class="m ${m.role}${m.state === "failed" ? " failed" : ""}">${esc(m.text)}` +
    (m.role === "user" && labels[m.state] ? `<small>${labels[m.state]}</small>` : "") + `</div>`).join("");
}
let poll = null;
function stopPoll() { if (poll) { clearTimeout(poll); poll = null; } }
// While a photo's messages are being handled, keep its conversation fresh.
// Only the transcript is redrawn, so whatever is being typed is kept. When
// the work is over, the grid and viewer are reloaded to show the new image.
function watchChat(id) {
  stopPoll();
  poll = setTimeout(async () => {
    poll = null;
    if (open < 0 || list[open]?.id !== id) return;
    let p;
    try { p = await api("/api/photos/" + id); } catch (e) { return watchChat(id); }
    if (p.busy) {
      const log = $("chatlog");
      if (log) { log.innerHTML = chatHtml(p); log.scrollTop = log.scrollHeight; }
      return watchChat(id);
    }
    await select(view, true, true);
    const i = list.findIndex(x => x.id === id);
    if (i >= 0) openViewer(i);
    else if (p.status === "awaiting_answer") say("Claude has a question about that photo. It is in the Queue.");
  }, 3000);
}
async function sendChat(id) {
  const box = $("chattext"), text = box.value.trim();
  if (!text) return;
  $("chatsend").disabled = true;
  const r = await fetch("/api/photos/" + id + "/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
  const out = await r.json().catch(() => ({}));
  if (!r.ok) { say(out.error || "That didn't send.", true); $("chatsend").disabled = false; return; }
  box.value = ""; growBox(box);
  say("");
  const i = open;
  const p = await api("/api/photos/" + id);
  const log = $("chatlog");
  log.innerHTML = chatHtml(p); log.scrollTop = log.scrollHeight;
  if (i >= 0) watchChat(id);
}
// The box grows with what is typed, up to a limit, then scrolls.
function growBox(box) {
  box.style.height = "auto";
  box.style.height = Math.min(box.scrollHeight, 192) + "px";
  const send = $("chatsend"); if (send) send.disabled = !box.value.trim();
}
async function decide(ruleId, id, accept) {
  const r = await fetch("/api/rules/" + ruleId + (accept ? "/activate" : "/retire"), { method: "POST" });
  const out = await r.json().catch(() => ({}));
  if (!r.ok) say(out.error || "That didn't work.", true);
  const i = list.findIndex(x => x.id === id);
  if (i >= 0) openViewer(i);
}

// ---- the sidebar's collapsible sections ----
// History, Chat and Watermark can each be folded away. A photo opens with all of them
// folded; what is then opened is kept while moving between photos and when a photo is redrawn.
const folds = { hist: false, chat: false, wm: false };
function foldSection(key, title, body) {
  const open = folds[key];

// What Immich knew about each original when it was copied: when it was taken,
// where, and whose account it came from. Nothing is shown for what is unknown.
function originalDetails(sources) {

    const m = s.meta || {}, rows = [];

    if (m.place) rows.push(["Place", m.place]);
    else if (m.latitude != null && m.longitude != null) rows.push(["Place", m.latitude.toFixed(4) + ", " + m.longitude.toFixed(4)]);
    if (m.owner_name) rows.push(["Owner", m.owner_name]);

      ? `<div class="meta aside-note">` + (sources.length > 1 ? `<div><b>Original ${i + 1}</b></div>` : "") +
        rows.map(([k, v]) => `<div><b>${k}</b> ${esc(v)}</div>`).join("") + `</div>`
      : "";
  }).join("");

      (styleNote ? `<div class="res">Look, from a chat edit: <b>${esc(styleNote)}</b></div>` : "");
    const rows = $("wmRows");
    rows.querySelector("[data-corner]").onchange = e => { corner = e.target.value; drawPreview(); };
    for (const b of rows.querySelectorAll("[data-off]")) b.onclick = () => { const it = fixed(b.dataset.off); for (const k of WM_LINES) it[k] = 0; drawRows(); drawPreview(); };
    // A line moves with everything it holds: its chips (and their order), its font, colour and weight, and the
    // open style strip and font note, by swapping it with the line above or below.
    const swapLines = (k, j) => {
      for (const x of items) [x[k], x[j]] = [x[j], x[k]];
      [lines[k], lines[j]] = [lines[j], lines[k]];
      [fontSaw[k], fontSaw[j]] = [fontSaw[j], fontSaw[k]];
      if (openStrip === k) openStrip = j; else if (openStrip === j) openStrip = k;
      if (fontHint === k) fontHint = j; else if (fontHint === j) fontHint = k;
      drawRows(); drawPreview();
    };
    for (const b of rows.querySelectorAll("[data-up]")) b.onclick = () => swapLines(b.dataset.up, WM_LINES[WM_LINES.indexOf(b.dataset.up) - 1]);
    for (const b of rows.querySelectorAll("[data-down]")) b.onclick = () => swapLines(b.dataset.down, WM_LINES[WM_LINES.indexOf(b.dataset.down) + 1]);
    for (const s of rows.querySelectorAll("[data-add]")) s.onchange = () => {
      const it = fixed(s.value), k = s.dataset.add; if (!it) return;
      for (const j of WM_LINES) it[j] = 0;                                 // a piece goes on one line only
      it[k] = Math.max(0, ...items.map(o => o[k])) + 1;                   // added later = written later
      drawRows(); drawPreview();
    };
    for (const b of rows.querySelectorAll("[data-aa]")) b.onclick = () => { openStrip = openStrip === b.dataset.aa ? null : b.dataset.aa; fontHint = null; drawRows(); drawSwatches(); };
    for (const s of rows.querySelectorAll("[data-font]")) s.onchange = () => {
      const k = s.dataset.font;
      if (s.value === "__suggest") { fontHint = k; drawRows(); const h = rows.querySelector(`[data-fonthint="${k}"]`); if (h) h.focus(); return; }
      lines[k].font = s.value; drawPreview();
    };
    for (const s of rows.querySelectorAll("[data-color]")) s.onchange = () => { lines[s.dataset.color].color = s.value; drawSwatches(); drawPreview(); };
    for (const b of rows.querySelectorAll("[data-bold]")) b.onclick = () => { lines[b.dataset.bold].bold = !lines[b.dataset.bold].bold; drawRows(); drawPreview(); };
    for (const b of rows.querySelectorAll("[data-italic]")) b.onclick = () => { lines[b.dataset.italic].italic = !lines[b.dataset.italic].italic; drawRows(); drawPreview(); };
    for (const h of rows.querySelectorAll("[data-fonthint]")) h.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); askFont(h.dataset.fonthint); } };
    for (const b of rows.querySelectorAll("[data-fontsend]")) b.onclick = () => askFont(b.dataset.fontsend);
    drawSwatches();
  };
  // Asks Claude for a font and colour for one line, in the context of the photo and all the text.
  const askFont = async k => {
    const hint = ($("wmRows").querySelector(`[data-fonthint="${k}"]`) || {}).value || "";
    const send = $("wmRows").querySelector(`[data-fontsend="${k}"]`); if (send) send.disabled = true;
    fontSaw[k] = "Asking Claude…"; drawRows();
    try {
      const r = await fetch("/api/photos/" + id + "/font", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ texts: WM_LINES.map(lineText), hint }) });
      const out = await r.json().catch(() => ({}));
      if (!r.ok) { fontSaw[k] = esc(out.error || "That didn't work."); drawRows(); return; }
      if (!options.fonts.includes(out.font) && !options.suggested_fonts.includes(out.font)) options.suggested_fonts.unshift(out.font);
      lines[k].font = out.font;
      if (out.color && out.color !== "auto") {
        const sw = (out.color + " " + (out.color_name || "")).trim();
        if (!options.suggested_colors.some(s => s.split(" ")[0] === out.color)) options.suggested_colors.unshift(sw);
        lines[k].color = out.color;
      }
      fontSaw[k] = `Claude suggests: <b>${esc(out.font)}</b>` + (out.color && out.color !== "auto" ? ` in <b>${esc(out.color_name || out.color)}</b>` : "") + (out.why ? ` — ${esc(out.why)}` : "");
      fontHint = null; drawRows(); drawPreview();
    } catch (e) { fontSaw[k] = "That didn't work."; drawRows(); }
  };

  // ---- the fields and their choices ----
  const setText = (it, text) => {
    it.text = text; it.raw = undefined;
    const box = $(FIELDS[it.key]); if (box && box.value !== text) box.value = text;
    drawPreview();
  };
  const choices = key => {
    const it = fixed(key), cur = it.text;
    if (key === "title") return [["__suggest", "Suggest title…"], ["__identify", "Identify…"], ...options.title.map(t => [t, t])];
    if (key === "location") {
      const out = [];
      if (w.parts && w.parts.place) out.push(["__immich", "Immich: " + trimHome(w.parts.place, home)]);
      if (w.parts && w.parts.coordinates) out.push(["__osm", "Look up (OSM)…"], ["__claude", "Ask Claude…"]);
      return [...out, ...options.location.map(t => [t, t])];
    }
    if (key === "author") return options.users.map(t => [t, t]);
    if (key === "date") return options.dates.map(t => [t, t]);
    return [];
  };
  const drawFields = () => {
    $("wmFields").innerHTML = WM_FIXED.map(([key, label]) =>
      `<div class="wmel"><label for="${FIELDS[key]}">${label}</label><input class="field" id="${FIELDS[key]}" maxlength="120" value="${esc(fixed(key).text)}">` +
      `<select class="pd" data-pick="${key}" aria-label="Choices for ${label}"><option value="">Current</option>${choices(key).map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join("")}</select>` +
      `<div class="askbox" data-askbox="${key}" hidden></div><div class="res" data-saw="${key}"></div></div>`).join("");
    for (const [key, boxId] of Object.entries(FIELDS)) {
      const it = fixed(key);
      $(boxId).oninput = () => setText(it, $(boxId).value);           // a field can always be edited by hand
    }
    for (const s of $("wmFields").querySelectorAll("[data-pick]")) s.onchange = () => pick(s.dataset.pick, s.value, s);
  };
  const saw = (key, html) => { const el = $("wmFields").querySelector(`[data-saw="${key}"]`); if (el) el.innerHTML = html || ""; };
  const askBox = (key, placeholder, go) => {
    const box = $("wmFields").querySelector(`[data-askbox="${key}"]`); if (!box) return;
    box.hidden = false;
    box.innerHTML = `<div class="hint"><input class="field" maxlength="80" placeholder="${esc(placeholder)}"><button type="button" class="send" aria-label="Ask">&rarr;</button></div>`;
    const inp = box.querySelector("input"), btn = box.querySelector("button");
    const run = async () => { btn.disabled = true; await go(inp.value); btn.disabled = false; box.hidden = true; box.innerHTML = ""; };
    btn.onclick = run;
    inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); run(); } else if (e.key === "Escape") { box.hidden = true; box.innerHTML = ""; } };
    inp.focus();
  };
  // Picking a choice fills the field above it; the pulldown goes back to Current, so the same
  // choice can be picked again, and Current itself puts the field back to what it held.
  const pick = async (key, value, sel) => {
    const it = fixed(key);
    const back = () => { sel.value = ""; };
    if (!value) { back(); return; }
    if (key === "title" && (value === "__suggest" || value === "__identify")) {
      const style = value === "__suggest" ? "title" : "subject";
      back();
      askBox(key, style === "title" ? "Hint (optional), e.g. the mood you want" : "Hint (optional), e.g. the bird on the left", hint => ask(style, hint));
      return;
    }
    if (key === "location" && value === "__immich") { setText(it, trimHome(w.parts.place, home)); back(); return; }
    if (key === "location" && (value === "__osm" || value === "__claude")) { back(); await locate(value === "__osm" ? "osm" : "claude"); return; }
    setText(it, value); back();
  };
  // Asks Claude to look at the picture: for a subject (one name) or titles (three). What comes back
  // is shown under the field and goes to the top of its choices; nothing is filled in by itself.
  const ask = async (style, hint) => {
    saw("title", "Asking Claude…");
    try {
      const r = await fetch("/api/photos/" + id + "/identify", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ hint: hint || "", style, avoid: options.title }) });
      const out = await r.json().catch(() => ({}));
      if (!r.ok) { saw("title", esc(out.error || "That didn't work.")); return; }
      const names = out.names || [];
      options.title = [...names, ...options.title.filter(t => !names.includes(t))];
      refreshChoices("title");
      saw("title", (style === "title" ? "Claude suggests: " : "Claude says: ") + names.map(n => `<b>${esc(n)}</b>`).join(" · "));
    } catch (e) { saw("title", "That didn't work."); }
  };
  // Names the place at the photo's coordinates from one source; the answer fills the field and
  // joins the choices, so Immich's, OpenStreetMap's and Claude's can be compared.
  const locate = async source => {
    saw("location", "Looking…");
    try {
      const r = await fetch("/api/photos/" + id + "/locate", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ source }) });
      const out = await r.json().catch(() => ({}));
      if (!r.ok) { saw("location", esc(out.error || "That didn't work.")); return; }
      await getHomeCountry();
      const place = trimHome(out.place, home);
      if (!options.location.includes(place)) options.location.unshift(place);
      refreshChoices("location");
      setText(fixed("location"), place);
      saw("location", (source === "osm" ? "OpenStreetMap says: " : "Claude says: ") + `<b>${esc(out.place)}</b>`);
    } catch (e) { saw("location", "That didn't work."); }
  };
  const refreshChoices = key => {
    const s = $("wmFields").querySelector(`[data-pick="${key}"]`); if (!s) return;
    s.innerHTML = `<option value="">Current</option>` + choices(key).map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join("");
  };
  const loadOptions = async () => {
    try {
      const o = await api("/api/photos/" + id + "/watermark/options");
      options.title = [...o.title, ...options.title.filter(t => !o.title.includes(t))];
      options.location = [...o.location, ...options.location.filter(t => !o.location.includes(t))];
      options.users = o.users || []; options.dates = o.dates || [];
      options.fonts = o.fonts || options.fonts; options.suggested_fonts = o.suggested_fonts || []; options.suggested_colors = o.suggested_colors || [];
      for (const [key] of WM_FIXED) refreshChoices(key);
      if (openStrip) drawRows();
    } catch (e) { /* the choices are optional */ }
  };
  // On opening: find the home country (to leave it off the location Immich gave).
  const loadHome = async () => {
    home = await getHomeCountry();
    const loc = fixed("location");
    if (loc.raw !== undefined) { const text = trimHome(loc.raw, home), raw = loc.raw; setText(loc, text); loc.raw = raw; }
    refreshChoices("location");
  };
  drawFields(); drawRows();
  // Add: the watermark goes to Claude as a chat request, with what the preview showed (the corner
  // it picked and the colour each line came out in) so Claude draws exactly that; the photo is
  // re-run with its history and this watermark in place of any earlier one. The chat shows it
  // working, as for any message, and the page reloads when the new step is in.
  $("wmSend").onclick = async () => {
    $("wmSend").disabled = true;
    const [title, subtitle, third] = WM_LINES.map(lineText);
    const r = await fetch("/api/photos/" + id + "/watermark", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title, subtitle, third, pieces: items.map(({ key, label, text, t, u, v }) => ({ key, label, text, t, u, v })), lines: WM_LINES.map(k => lines[k]), corner, style_note: styleNote,
        drawn: { corner: drawnCorner, colors: lastColors } }) });
    const out = await r.json().catch(() => ({}));
    $("wmSend").disabled = false;
    if (!r.ok) { status(out.error || "That didn't work."); return; }
    say("Watermark sent to Claude; the new step appears when it is done.");
    closeWm(false); setFold("chat", true);
    const p = await api("/api/photos/" + id);
    const log = $("chatlog");
    if (log) { log.innerHTML = chatHtml(p); log.scrollTop = log.scrollHeight; }
    watchChat(id);
  };
  if (folds.wm) { start(); drawPreview(); }
}
// The original, full size, over the photo view. Click it, or press Esc, to close. The round "i"
// beside Close opens what is known about this original (see originalInfo).
function showOriginal(id, source, type) {
  const o = $("overlay"), src = `/media/${id}/source/${source.index}`;
  o.innerHTML = (type === "video" ? `<video controls autoplay src="${src}"></video>` : `<img src="${src}" alt="Original">`) +
    `<div class="tools"><button type="button" class="infobtn" id="infoBtn" aria-label="About this original" aria-expanded="false" aria-controls="infoPop">i</button>` +
    `<button type="button" class="btn sec sm close" aria-label="Close original">Close</button></div>` +
    `<div class="infopop" id="infoPop" role="dialog" aria-label="About this original" hidden>` +
    `<h5>About this original <button type="button" class="x" id="infoX" aria-label="Close information">&times;</button></h5>${originalInfo(source)}</div>`;
  o.hidden = false; pushLayer("overlay", closeOriginal);
  o.onclick = e => { if (e.target.tagName !== "VIDEO") backLayer("overlay", closeOriginal); };
  const tools = o.querySelector(".tools");
  tools.onclick = e => e.stopPropagation();                    // the buttons are not clicks on the photo
  tools.querySelector(".close").onclick = () => backLayer("overlay", closeOriginal);
  $("infoPop").onclick = e => e.stopPropagation();
  $("infoBtn").onclick = () => toggleInfo();
  $("infoX").onclick = () => toggleInfo(false);
}
function toggleInfo(show) {
  const pop = $("infoPop"), btn = $("infoBtn");
  if (!pop) return false;
  const on = show === undefined ? pop.hidden : show;
  pop.hidden = !on; btn.setAttribute("aria-expanded", String(on));
  return on;
}
// What is known about one original, in three groups: who/when/where, the picture, and the file.
// A row with nothing recorded is left out, and so is a group with nothing in it.
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function niceTaken(taken) {
  const m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})$/.exec(taken || "");
  if (!m) return taken || "";
  const h = +m[4], h12 = h % 12 || 12;
  return `${MONTHS[+m[2] - 1]} ${+m[3]}, ${m[1]}, ${h12}:${m[5]} ${h < 12 ? "AM" : "PM"}`;
}
function niceBytes(n) { return n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; }
function originalInfo(source) {
  const m = (source && source.meta) || {};
  // A place that is only the coordinates ("9.4300, -84.1600") says nothing more than the Coordinates row.
  const coords = m.latitude != null && m.longitude != null ? m.latitude.toFixed(4) + ", " + m.longitude.toFixed(4) : "";
  const place = m.place && !/^-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?$/.test(m.place) ? m.place : "";
  const size = [m.width && m.height ? `${m.width} × ${m.height}` : "", m.size_bytes ? niceBytes(m.size_bytes) : ""].filter(Boolean).join(" · ");
  const exposure = [m.exposure_time ? m.exposure_time + " s" : "", m.f_number ? "f/" + m.f_number : "", m.iso ? "ISO " + m.iso : ""].filter(Boolean).join(" · ");
  const groups = [
    [["Owner", m.owner_name], [m.taken_kind === "file" ? "File date" : "Taken", niceTaken(m.taken)], ["Place", place], ["Coordinates", coords]],
    [["Size", size], ["Camera", m.camera], ["Exposure", exposure]],
    [["File name", source && source.file_name], ["Asset ID", source && source.asset_id, "mono"]],
  ].map(g => g.filter(r => r[1])).filter(g => g.length);
  if (!groups.length) return `<p class="none">Nothing is recorded about this original.</p>`;
  return groups.map(g => `<dl>` + g.map(([k, v, cls]) => `<dt>${k}</dt><dd${cls ? ` class="${cls}"` : ""}>${esc(v)}</dd>`).join("") + `</dl>`).join("<hr>");
}
// The finished photo (the step now showing), full size, in the same overlay.
function showCurrent(id, version) {
  const o = $("overlay");
  o.innerHTML = `<img src="/media/${id}/full?v=${version}" alt="The photo"><button class="btn sec sm close" aria-label="Close photo">Close</button>`;
  o.hidden = false; pushLayer("overlay", closeOriginal);
  o.onclick = () => backLayer("overlay", closeOriginal);
}
// The photo window and the original/finished photo over it each take one step in the browser's history, so the
// browser's Back button closes the top one (and nothing more) and leaves the page where it was. Their own Back,
// Close and Escape give that step back; a close the page makes by itself (changing view, the photo gone) does
// not touch the history, so it can never undo a change of view.
const layers = []; let skipPops = 0;
function pushLayer(name, close) {
  if (layers.some(l => l.name === name)) return;
  try { history.pushState({ layer: name }, ""); layers.push({ name, close }); } catch (e) { /* no history: Back just won't be caught */ }
}
function dropLayer(name) { const i = layers.findIndex(l => l.name === name); if (i >= 0) layers.splice(i, 1); return i >= 0; }
function backLayer(name, close) { if (dropLayer(name)) { close(); skipPops++; history.back(); } else close(); }
window.addEventListener("popstate", () => { if (skipPops) { skipPops--; return; } const l = layers.pop(); if (l) l.close(); });
function closeOriginal() { dropLayer("overlay"); const o = $("overlay"); o.hidden = true; o.innerHTML = ""; }
function closeViewer() { closeOriginal(); dropLayer("viewer"); stopPoll(); open = -1; $("viewer").classList.remove("open"); $("stage").innerHTML = ""; }
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("confirm").hidden) { backLayer("confirm", closeConfirm); return; }
  if (e.key === "Escape" && !$("retPop").hidden) { backLayer("retention", closeRetention); return; }
  if (e.key === "Escape" && !$("overlay").hidden) { if (!$("infoPop") || $("infoPop").hidden) backLayer("overlay", closeOriginal); else toggleInfo(false); return; }
  if (e.key === "Escape" && menuEl) { closeMenu(); return; }
  if (open < 0) return;
  const typing = ["TEXTAREA", "INPUT", "SELECT"].includes(e.target.tagName);
  if (typing && e.key !== "Escape") return;
  if (e.key === "Escape") backLayer("viewer", closeViewer);
  else if (e.key === "ArrowRight") openViewer(open + 1);
  else if (e.key === "ArrowLeft") openViewer(open - 1);
});

// ---- live updates ----
// The server says when the library changes (a photo arrives, finishes, moves).
// Only what changed is touched: the sidebar counts, and the tiles that were
// added, removed or changed. The open photo, the form being filled in, the
// selection and the scroll position are left as they are.
async function syncCounts() {
  const t = await api("/api/tree");
  const links = [...document.querySelectorAll("#tree a.item:not(.pane)")];
  const want = ["queue", "review", "live", ...t.albums.map(a => a.view), "trash"];
  if (links.length !== want.length || links.some((a, i) => a.dataset.view !== want[i])) {
    // An album appeared or went: redraw the (small) sidebar.
    treeAlbums = t.albums; albums = t.albums.map(a => a.name);
    await renderTree(canonicalView(view, treeAlbums), "");
    return;
  }
  const counts = [t.queue, t.review, t.live, ...t.albums.map(a => a.count), t.trash];
  links.forEach((a, i) => paintCount(a, a.dataset.view, counts[i]));
}
async function syncGrid() {
  if (isPane(view)) return;                            // Photos and Recipe rules have no grid to keep in step
  const token = loadToken, v = view;
  const photos = (await api("/api/photos?view=" + encodeURIComponent(v))).photos;
  if (token !== loadToken || v !== view) return;       // the person went elsewhere meanwhile
  const openId = open >= 0 ? (list[open] || {}).id : null;
  const grid = $("grid"), have = new Map([...grid.children].map(el => [el.dataset.id, el]));
  const next = [];
  photos.forEach((p, i) => {
    let el = have.get(p.id);
    if (!el || el.dataset.sig !== tileSig(p)) {
      const box = document.createElement("div");
      box.innerHTML = tile(p, i);
      const fresh = box.firstElementChild;
      wireTile(fresh);
      if (el) el.replaceWith(fresh);
      el = fresh;
    }
    have.delete(p.id);
    next.push(el);
  });
  for (const gone of have.values()) gone.remove();
  next.forEach((el, i) => { el.dataset.i = i; if (grid.children[i] !== el) grid.insertBefore(el, grid.children[i] || null); });
  list = photos;
  for (const id of [...selected]) if (!list.some(p => p.id === id)) selected.delete(id);
  $("total").textContent = list.length + (list.length === 1 ? " photo" : " photos");
  $("empty").hidden = list.length > 0;
  if (openId) { const i = list.findIndex(p => p.id === openId); if (i >= 0) open = i; else closeViewer(); }
  updateBar();
}
let liveBusy = false, livePending = false, liveTimer = null, liveSeen = null;
async function syncLive() {
  if (liveBusy) { livePending = true; return; }
  liveBusy = true;
  try { await Promise.all([syncCounts(), syncGrid()]); } catch (e) { /* the next change tries again */ }
  finally { liveBusy = false; if (livePending) { livePending = false; syncLive(); } }
}
function liveChanged() {
  clearTimeout(liveTimer);
  // Wait for a burst of writes to settle, and for any open menu to be done with.
  if (document.hidden) return;                          // it is picked up when the tab is shown again
  liveTimer = setTimeout(() => { if (menuEl) liveChanged(); else syncLive(); }, menuEl ? 2000 : 400);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && liveSeen !== null) liveChanged(); });
if (window.EventSource) {
  const events = new EventSource("/api/events");
  events.onmessage = e => { const changed = liveSeen !== null && e.data !== liveSeen; liveSeen = e.data; if (changed) liveChanged(); };
}

// The address fragment picks the place: /#album:costa-rica opens that album.
// Clicking the sidebar changes the fragment, which comes back through here.
window.addEventListener("hashchange", () => { const v = hashView(location.hash); if (v && v !== view) select(v); });
const first = hashView(location.hash);
if (!first) history.replaceState(null, "", viewHash("review"));
select(first || "review");

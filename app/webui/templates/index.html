<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>immich-photo-pipeline</title>
  {% include "_icons.html" %}
  <link rel="stylesheet" href="{{ url_for('static', filename='pipeline.css') }}">
</head>
<body>
  <nav>
    <h1>Photo pipeline</h1>
    <div id="tree"></div>
    <div class="links"><a class="item" href="/rules">Recipe rules</a></div>
  </nav>
  <main>
    <div class="card head">
      <h2 id="title"></h2>
      <span class="chip" id="total"></span>
      <span class="sp"></span>
      <span id="status" class="status" role="status"></span>
    </div>
    <div id="bar" class="card" hidden>
      <strong id="count"></strong>
      <button class="btn sec" onclick="selectAll()">Select all</button>
      <button class="btn sec" onclick="clearSel()">Clear</button>
      <span class="sp"></span>
      <span id="normal">
        <button class="btn sec" id="addLive" onclick="promote(true)">Add to Live</button>
        <button class="btn sec" id="rmLive" onclick="promote(false)">Remove from Live</button>
        <button class="btn" id="moveBtn" onclick="moveMenu(this)">Move to &#9662;</button>
        <button class="btn warn" onclick="trashSel()">Trash</button>
      </span>
      <span id="intrash" hidden><button class="btn" onclick="restoreSel()">Restore</button></span>
    </div>
    <div id="grid" class="grid" style="margin-top:1rem"></div>
    <div id="empty" class="empty" hidden></div>
  </main>
  <div id="viewer">
    <div class="dialog">
      <section class="photo">
        <header id="vhead"></header>
        <div class="stage" id="stage"></div>
        <footer id="vfoot"></footer>
      </section>
      <aside id="panel"></aside>
    </div>
  </div>
  <div id="overlay" hidden></div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
<script>
let view = "review", list = [], open = -1, albums = [], treeAlbums = [], loadToken = 0;
const selected = new Set();
// What the last action in each place said. Each view has its own, so the
// message belongs to the place it happened and not to whatever is open now.
const statusByView = {};

// ---- status ----
function renderStatus() {
  const s = statusByView[view];
  const el = $("status");
  el.textContent = s ? s.text : "";
  el.className = "status" + (s && s.bad ? " bad" : "");
}
function say(text, bad) {
  if (text) statusByView[view] = { text, bad: !!bad }; else delete statusByView[view];
  renderStatus();
}

// ---- menus (the "Move to" choices) ----
let menuEl = null;
function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
function openMenu(anchor, items, pick) {
  closeMenu();
  const m = document.createElement("div");
  m.className = "menu"; menuEl = m;
  const draw = () => {
    m.innerHTML = items.map((it, i) => it.sep ? `<div class="sep"></div>` : `<button data-i="${i}">${esc(it.label)}</button>`).join("");
    for (const b of m.querySelectorAll("button")) b.onclick = () => {
      const it = items[+b.dataset.i];
      if (it.value !== null) { closeMenu(); pick(it.value); } else askName();
    };
  };
  const askName = () => {
    m.innerHTML = `<div class="newname"><input class="field" maxlength="60" placeholder="Album name"><button class="btn sm">Create</button></div>`;
    const inp = m.querySelector("input");
    const go = () => { const v = inp.value.trim(); if (v) { closeMenu(); pick(v); } };
    m.querySelector("button").onclick = go;
    inp.onkeydown = e => { e.stopPropagation(); if (e.key === "Enter") { e.preventDefault(); go(); } else if (e.key === "Escape") closeMenu(); };
    inp.focus();
  };
  draw();
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + "px";
  m.style.top = (r.bottom + 8 + h > innerHeight && r.top - 8 - h > 0 ? r.top - 8 - h : r.bottom + 8) + "px";
  const first = m.querySelector("button"); if (first) first.focus();
}
document.addEventListener("mousedown", e => { if (menuEl && !menuEl.contains(e.target)) closeMenu(); }, true);

// Only offer places that make sense: never the album a photo is already in.
function moveItems(photos) {
  const homes = new Set(photos.map(p => p.home));
  const here = homes.size === 1 ? [...homes][0] : null;
  const items = [];
  if (here !== "review") items.push({ label: "Review", value: "review" });
  for (const a of albums) if (a !== here) items.push({ label: a, value: a });
  items.push({ sep: true }, { label: "New album…", value: null });
  return items;
}
function moveMenu(anchor) {
  const photos = selPhotos();
  openMenu(anchor, moveItems(photos), home => act("/api/photos/move", { ids: photos.map(p => p.id), home }, "Moved to " + home));
}

// ---- the grid ----
async function select(v, keep, keepViewer) {
  const token = ++loadToken;
  view = v;
  if (!keepViewer) closeViewer();
  closeMenu();
  if (!keep) selected.clear();
  $("title").textContent = viewTitle(v, treeAlbums);
  renderStatus();
  document.title = viewTitle(v, treeAlbums) + " · immich-photo-pipeline";
  let t, photos;
  try {
    [t, photos] = await Promise.all([renderTree(v, ""), api("/api/photos?view=" + encodeURIComponent(v))]);
  } catch (e) {
    if (token !== loadToken) return;
    if (v !== "review") { history.replaceState(null, "", viewHash("review")); return select("review"); }
    say("Couldn't load the photos.", true); return;
  }
  if (token !== loadToken) return;
  treeAlbums = t.albums;
  albums = t.albums.map(a => a.name);
  $("title").textContent = viewTitle(v, treeAlbums);
  document.title = viewTitle(v, treeAlbums) + " · immich-photo-pipeline";
  const canon = canonicalView(v, treeAlbums);
  if (canon !== v) { view = canon; history.replaceState(null, "", viewHash(canon)); renderStatus(); renderTree(canon, "").catch(() => {}); }
  list = photos.photos;
  for (const id of [...selected]) if (!list.some(p => p.id === id)) selected.delete(id);
  $("total").textContent = list.length + (list.length === 1 ? " photo" : " photos");
  $("grid").innerHTML = list.map((p, i) => tile(p, i)).join("");
  $("empty").hidden = list.length > 0;
  $("empty").textContent = "Nothing here.";
  for (const el of $("grid").querySelectorAll(".tile")) {
    el.onclick = () => openViewer(+el.dataset.i);
    el.querySelector(".pick").onclick = e => { e.stopPropagation(); toggle(list[+el.dataset.i].id, el); };
  }
  updateBar();
}
function toggle(id, el) {
  if (selected.has(id)) selected.delete(id); else selected.add(id);
  el.classList.toggle("sel", selected.has(id));
  updateBar();
}
function selectAll() { for (const p of list) selected.add(p.id); for (const t of $("grid").children) t.classList.add("sel"), t.querySelector(".pick").checked = true; updateBar(); }
function clearSel() { selected.clear(); for (const t of $("grid").children) t.classList.remove("sel"), t.querySelector(".pick").checked = false; updateBar(); }
const selPhotos = () => list.filter(p => selected.has(p.id));
// The buttons offered depend on what is selected: nothing to add to Live if
// every chosen photo is already there, nothing to remove if none is.
function updateBar() {
  const sel = selPhotos();
  $("bar").hidden = sel.length === 0;
  $("count").textContent = sel.length + " selected";
  const trash = view === "trash";
  $("normal").hidden = trash; $("intrash").hidden = !trash;
  $("addLive").hidden = !sel.some(p => !p.live);
  $("rmLive").hidden = !sel.some(p => p.live);
}

// ---- actions ----
// `viewerId` is set when the action was started from the photo view, so the
// view stays open on that photo if it is still in this list.
async function act(path, payload, what, viewerId) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
  const out = await r.json();
  if (!r.ok) { say(out.error || "That didn't work.", true); return null; }
  const skipped = out.skipped.map(s => s.reason + " (" + s.id.slice(0, 8) + ")");
  say(`${what}: ${out.done.length} done` + (skipped.length ? `, ${skipped.length} skipped: ${[...new Set(out.skipped.map(s => s.reason))].join("; ")}` : ""), out.done.length === 0 && skipped.length > 0);
  for (const id of out.done) selected.delete(id);
  await select(view, true, !!viewerId);
  if (viewerId) {
    const i = list.findIndex(p => p.id === viewerId);
    if (i >= 0) openViewer(i); else closeViewer();
  }
  return out;
}
// Moving a photo from its own view takes you with it: the place it was moved
// to opens with the photo still in front of you, instead of the view closing.
async function moveAndFollow(id, home) {
  const r = await fetch("/api/photos/move", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ids: [id], home }) });
  const out = await r.json();
  if (!r.ok) { say(out.error || "That didn't work.", true); return; }
  if (!out.done.includes(id)) { say("Not moved: " + out.skipped.map(s => s.reason).join("; "), true); return; }
  const t = await api("/api/tree");
  const want = home.toLowerCase();
  const album = t.albums.find(a => a.name.toLowerCase() === want);
  const dest = want === "review" ? "review" : album ? album.view : view;
  if (dest !== view) history.replaceState(null, "", viewHash(dest));
  await select(dest, false, true);
  say("Moved to " + home);
  const i = list.findIndex(x => x.id === id);
  if (i >= 0) openViewer(i); else closeViewer();
}
const ids = () => [...selected];
const promote = live => act("/api/photos/promote", { ids: ids(), live }, live ? "Added to Live" : "Removed from Live");
const trashSel = () => act("/api/photos/trash", { ids: ids() }, "Trashed");
const restoreSel = () => act("/api/photos/restore", { ids: ids() }, "Restored");
async function revertTo(id, step) {
  const r = await fetch("/api/photos/" + id + "/revert", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ step }) });
  const out = await r.json();
  if (!r.ok) { say(out.error || "That didn't work.", true); return; }
  say(out.unchanged ? "Already showing that step." : "Reverted to step " + step + " (now step " + out.step + ").");
  await select(view, true, true);
  const i = list.findIndex(p => p.id === id);
  if (i >= 0) openViewer(i);
}
function tile(p, i) {
  const label = p.status !== "ready" ? p.status.replace("_", " ") : p.media_type === "video" ? "video" : "";
  const inner = p.media_type === "image" && p.has_image
    ? `<img loading="lazy" src="/media/${p.id}/thumb?v=${p.version}" alt="">`
    : `<div class="ph">${esc(p.media_type === "video" ? "Video" : p.status.replace("_", " "))}</div>`;
  const on = selected.has(p.id);
  return `<div class="tile${on ? " sel" : ""}" data-i="${i}">${inner}<input class="pick" type="checkbox"${on ? " checked" : ""} aria-label="Select">${label ? `<span class="badge">${esc(label)}</span>` : ""}` +
         `${p.live ? `<span class="badge live">Live</span>` : ""}</div>`;
}

// ---- chat ----
function chatHtml(p) {
  const labels = { queued: "waiting", working: "working on it…", failed: "failed" };
  return p.chat.map(m =>
    `<div class="m ${m.role}${m.state === "failed" ? " failed" : ""}">${esc(m.text)}` +
    (m.role === "user" && labels[m.state] ? `<small>${labels[m.state]}</small>` : "") + `</div>`).join("");
}
let poll = null;
function stopPoll() { if (poll) { clearTimeout(poll); poll = null; } }
// While a photo's messages are being handled, keep its conversation fresh.
// Only the transcript is redrawn, so whatever is being typed is kept. When
// the work is over, the grid and viewer are reloaded to show the new image.
function watchChat(id) {
  stopPoll();
  poll = setTimeout(async () => {
    poll = null;
    if (open < 0 || list[open]?.id !== id) return;
    let p;
    try { p = await api("/api/photos/" + id); } catch (e) { return watchChat(id); }
    if (p.busy) {
      const log = $("chatlog");
      if (log) { log.innerHTML = chatHtml(p); log.scrollTop = log.scrollHeight; }
      return watchChat(id);
    }
    await select(view, true, true);
    const i = list.findIndex(x => x.id === id);
    if (i >= 0) openViewer(i);
    else if (p.status === "awaiting_answer") say("Claude has a question about that photo. It is in the Queue.");
  }, 3000);
}
async function sendChat(id) {
  const box = $("chattext"), text = box.value.trim();
  if (!text) return;
  $("chatsend").disabled = true;
  const r = await fetch("/api/photos/" + id + "/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
  const out = await r.json().catch(() => ({}));
  if (!r.ok) { say(out.error || "That didn't send.", true); $("chatsend").disabled = false; return; }
  box.value = ""; growBox(box);
  say("");
  const i = open;
  const p = await api("/api/photos/" + id);
  const log = $("chatlog");
  log.innerHTML = chatHtml(p); log.scrollTop = log.scrollHeight;
  if (i >= 0) watchChat(id);
}
// The box grows with what is typed, up to a limit, then scrolls.
function growBox(box) {
  box.style.height = "auto";
  box.style.height = Math.min(box.scrollHeight, 192) + "px";
  const send = $("chatsend"); if (send) send.disabled = !box.value.trim();
}
async function decide(ruleId, id, accept) {
  const r = await fetch("/api/rules/" + ruleId + (accept ? "/activate" : "/retire"), { method: "POST" });
  const out = await r.json().catch(() => ({}));
  if (!r.ok) say(out.error || "That didn't work.", true);
  const i = list.findIndex(x => x.id === id);
  if (i >= 0) openViewer(i);
}

// ---- the photo view ----
async function openViewer(i) {
  if (i < 0 || i >= list.length) return;
  stopPoll(); closeMenu();
  open = i;
  const p = await api("/api/photos/" + list[i].id);
  if (open !== i) return;
  $("viewer").classList.add("open");
  $("vhead").innerHTML =
    `<h3>${esc(p.id.slice(0, 8))}</h3><span class="chip">${esc(p.home)}</span>` +
    (p.live ? `<span class="chip blue">Live</span>` : "") +
    (p.status !== "ready" ? `<span class="chip bad">${esc(p.status.replace("_", " "))}</span>` : "") +
    `<span class="sp"></span>` +
    (p.trashed ? `<button class="btn" id="vRestore">Restore</button>` :
      `<button class="btn sec sm" id="vLive">${p.live ? "Remove from Live" : "Add to Live"}</button>` +
      `<button class="btn sm" id="vMove">Move to &#9662;</button>` +
      `<button class="btn warn sm" id="vTrash">Trash</button>`) +
    `<button class="btn sec sm" id="vClose">Close</button>`;
  const run = (path, what) => act(path, { ids: [p.id], ...(path.endsWith("promote") ? { live: !p.live } : {}) }, what, p.id);
  $("vClose").onclick = closeViewer;
  if (p.trashed) $("vRestore").onclick = () => run("/api/photos/restore", "Restored");
  else {
    $("vLive").onclick = () => run("/api/photos/promote", p.live ? "Removed from Live" : "Added to Live");
    $("vTrash").onclick = () => run("/api/photos/trash", "Trashed");
    $("vMove").onclick = e => openMenu(e.currentTarget, moveItems([p]), home => moveAndFollow(p.id, home));
  }
  $("stage").innerHTML = (!p.has_image ? `<div class="meta" style="color:#93a0ba">No image yet</div>` : p.media_type === "video"
    ? `<video controls autoplay src="/media/${p.id}/full"></video>`
    : `<img src="/media/${p.id}/full?v=${p.version}" alt="">`) +
    (i > 0 ? `<button class="btn sec nav prev" id="vPrev" aria-label="Previous">&lsaquo;</button>` : "") +
    (i < list.length - 1 ? `<button class="btn sec nav next" id="vNext" aria-label="Next">&rsaquo;</button>` : "");
  if ($("vPrev")) $("vPrev").onclick = () => openViewer(open - 1);
  if ($("vNext")) $("vNext").onclick = () => openViewer(open + 1);
  const cur = p.history.find(h => h.current);
  $("vfoot").textContent = `${i + 1} of ${list.length}` + (cur ? ` · showing step ${cur.step}` : "") +
    (p.imported ? " · imported" : "") + ` · ← → to move, Esc to close`;

  const hist = p.history.map(h =>
    `<div class="rev${h.current ? " current" : ""}"><div class="t"><b>Step ${h.step}</b><br><span class="note">` +
    `${h.step === 0 ? "Original result" : h.reverts_to_step !== null ? "Reverted to step " + h.reverts_to_step : esc(h.instruction || "(no instruction)")}` +
    (h.rules && h.rules.length ? ` (${h.rules.length} rule${h.rules.length > 1 ? "s" : ""})` : "") + `</span></div>` +
    (h.current ? `<span class="chip blue">Current</span>` :
      !p.trashed && p.status === "ready" && !p.busy ? `<button class="btn sec sm" data-revert="${h.step}">Revert</button>` : "") + `</div>`).reverse().join("");
  const chat = p.chat_blocked && !p.chat.length
    ? `<p class="meta aside-note">${esc(p.chat_blocked)}</p>`
    : `<div id="chatlog">${chatHtml(p)}</div>` +
      (p.proposal ? `<div class="proposal">Remember for future photos: &ldquo;${esc(p.proposal.text)}&rdquo;` +
        `<div class="row"><button class="btn sm" data-decide="1">Accept</button><button class="btn sec sm" data-decide="0">Dismiss</button></div></div>` : "") +
      (p.chat_blocked ? `<p class="meta aside-note">${esc(p.chat_blocked)}</p>` :
        `<div id="chatform"><div class="composer"><textarea id="chattext" rows="1" maxlength="1000" placeholder="${p.question ? "Answer Claude…" : "Describe a change…"}"></textarea>` +
        `<button class="send" id="chatsend" aria-label="Send" disabled>&uarr;</button></div>` +
        `<div class="hint">Enter to send &middot; Ctrl+Enter for a new line</div></div>`);
  const withCopy = p.sources.filter(s => s.has_copy);
  const originals = p.imported || !withCopy.length
    ? (p.imported || p.status === "ready" ? `<p class="meta aside-note">No separate original: this photo was imported as it is.</p>` : "")
    : `<div class="origs">` + withCopy.map(s => s.media_type === "video"
        ? `<button class="orig" data-orig="${s.index}" data-type="video" title="${esc(s.name)}"><span class="ph">Video</span></button>`
        : `<button class="orig" data-orig="${s.index}" data-type="image" title="${esc(s.name)}"><img loading="lazy" src="/media/${p.id}/source/${s.index}/thumb" alt="Original ${esc(s.name)}"></button>`).join("") + `</div>`;
  $("panel").innerHTML =
    `<h4>Original${withCopy.length > 1 ? "s" : ""}</h4>${originals}${originalDetails(p.sources)}` +
    (p.error ? `<p class="err aside-note">${esc(p.error)}</p>` : "") +
    (p.question ? `<p class="aside-note">Claude asks: ${esc(p.question)}</p>` : "") +
    `<h4>History</h4><div class="hist">${hist}</div>` +
    (p.legacy_notes.length ? `<h4>Earlier notes</h4><ul class="meta" style="margin:0 1.1rem .5rem;padding-left:1.1rem">${p.legacy_notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : "") +
    `<div class="changes"><h4>Ask Claude to change it</h4>${p.chat_blocked ? "" : watermarkForm(p.watermark)}${chat}</div>`;
  wireWatermark(p.id);
  for (const b of $("panel").querySelectorAll("[data-orig]")) b.onclick = () => showOriginal(p.id, +b.dataset.orig, b.dataset.type);
  for (const b of $("panel").querySelectorAll("[data-revert]")) b.onclick = () => revertTo(p.id, +b.dataset.revert);
  for (const b of $("panel").querySelectorAll("[data-decide]")) b.onclick = () => decide(p.proposal.id, p.id, b.dataset.decide === "1");
  const log = $("chatlog");
  if (log) log.scrollTop = log.scrollHeight;
  const box = $("chattext");
  if (box) {
    box.oninput = () => growBox(box);
    // Enter sends; Ctrl+Enter (or Shift+Enter) adds a line.
    box.onkeydown = e => {
      if (e.key !== "Enter" || e.isComposing) return;
      e.preventDefault();
      if (e.ctrlKey || e.metaKey || e.shiftKey) { box.setRangeText("\n", box.selectionStart, box.selectionEnd, "end"); growBox(box); }
      else sendChat(p.id);
    };
    $("chatsend").onclick = () => sendChat(p.id);
  }
  if (p.busy) watchChat(p.id);
}
// What Immich knew about each original when it was copied: when it was taken,
// where, and whose account it came from. Nothing is shown for what is unknown.
function originalDetails(sources) {
  const blocks = sources.map((s, i) => {
    const m = s.meta || {}, rows = [];
    if (m.taken) rows.push([m.taken_kind === "file" ? "File date" : "Taken", m.taken]);
    if (m.place) rows.push(["Place", m.place]);
    else if (m.latitude != null && m.longitude != null) rows.push(["Place", m.latitude.toFixed(4) + ", " + m.longitude.toFixed(4)]);
    if (m.owner_name) rows.push(["Owner", m.owner_name]);
    return rows.length
      ? `<div class="meta aside-note">` + (sources.length > 1 ? `<div><b>Original ${i + 1}</b></div>` : "") +
        rows.map(([k, v]) => `<div><b>${k}</b> ${esc(v)}</div>`).join("") + `</div>`
      : "";
  }).join("");
  if (blocks) return blocks;
  return sources.length && sources.every(s => s.meta && s.meta.unavailable)
    ? `<p class="meta aside-note">No details of the original: Immich no longer has it.</p>` : "";
}
// The watermark builder: two lines, seeded from the original's details, that
// the reviewer can change before asking Claude to add them as a new step.
function watermarkForm(w) {
  return `<div class="wm"><button class="btn sec sm" id="wmOpen">Add a watermark…</button>` +
    `<div id="wmForm" hidden><label>Title<input class="field" id="wmTitle" maxlength="120" value="${esc(w.title)}"></label>` +
    `<label>Underneath<input class="field" id="wmSub" maxlength="120" value="${esc(w.subtitle)}"></label>` +
    `<div class="row"><button class="btn sm" id="wmSend">Add watermark</button><button class="btn sec sm" id="wmCancel">Cancel</button></div></div></div>`;
}
function wireWatermark(id) {
  const open = $("wmOpen"); if (!open) return;
  const form = $("wmForm");
  const toggle = show => { form.hidden = !show; open.hidden = show; };
  open.onclick = () => { toggle(true); $("wmTitle").focus(); };
  $("wmCancel").onclick = () => toggle(false);
  $("wmSend").onclick = async () => {
    $("wmSend").disabled = true;
    const r = await fetch("/api/photos/" + id + "/watermark", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title: $("wmTitle").value, subtitle: $("wmSub").value }) });
    const out = await r.json().catch(() => ({}));
    if (!r.ok) { say(out.error || "That didn't send.", true); $("wmSend").disabled = false; return; }
    say("Watermark requested.");
    toggle(false); $("wmSend").disabled = false;
    const p = await api("/api/photos/" + id), log = $("chatlog");
    if (log) { log.innerHTML = chatHtml(p); log.scrollTop = log.scrollHeight; }
    watchChat(id);
  };
}
// The original, full size, over the photo view. Click it, or press Esc, to close.
function showOriginal(id, index, type) {
  const o = $("overlay"), src = `/media/${id}/source/${index}`;
  o.innerHTML = (type === "video" ? `<video controls autoplay src="${src}"></video>` : `<img src="${src}" alt="Original">`) +
    `<button class="btn sec sm close" aria-label="Close original">Close</button>`;
  o.hidden = false;
  o.onclick = e => { if (e.target.tagName !== "VIDEO") closeOriginal(); };
}
function closeOriginal() { const o = $("overlay"); o.hidden = true; o.innerHTML = ""; }
function closeViewer() { closeOriginal(); stopPoll(); open = -1; $("viewer").classList.remove("open"); $("stage").innerHTML = ""; }
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("overlay").hidden) { closeOriginal(); return; }
  if (e.key === "Escape" && menuEl) { closeMenu(); return; }
  if (open < 0) return;
  const typing = ["TEXTAREA", "INPUT", "SELECT"].includes(e.target.tagName);
  if (typing && e.key !== "Escape") return;
  if (e.key === "Escape") closeViewer();
  else if (e.key === "ArrowRight") openViewer(open + 1);
  else if (e.key === "ArrowLeft") openViewer(open - 1);
});

// The address fragment picks the place: /#album:costa-rica opens that album.
// Clicking the sidebar changes the fragment, which comes back through here.
window.addEventListener("hashchange", () => { const v = hashView(location.hash); if (v && v !== view) select(v); });
const first = hashView(location.hash);
if (!first) history.replaceState(null, "", viewHash("review"));
select(first || "review");
</script>
